<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Funny Sound Board</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    background: 
      repeating-linear-gradient(45deg, 
        #ff6b6b, 
        #4ecdc4 10px, 
        #45b7d1 20px, 
        #96ceb4 30px, 
        #feca57 40px, 
        #ff6b6b 50px
      );
    font-family: "Comic Sans MS", cursive, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .header {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 30px;
  }

  h1 {
    color: white;
    text-shadow: 3px 3px 0 #ff6b6b, 
                 6px 6px 0 #4ecdc4,
                 9px 9px 0 #45b7d1;
    font-size: 3.5rem;
    margin: 0 0 20px 0;
    text-align: center;
    animation: bounce 2s infinite alternate;
  }

  @keyframes bounce {
    from { transform: translateY(0px); }
    to { transform: translateY(-20px); }
  }

  .controls {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
  }

  .pause-btn {
    background: linear-gradient(145deg, #ff6b6b, #ff4757);
    color: white;
    border: none;
    padding: 12px 25px;
    font-size: 1.2rem;
    font-family: "Comic Sans MS", cursive;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.2);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .pause-btn:hover {
    transform: translateY(-3px);
    box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.2);
  }

  .pause-btn:active {
    transform: translateY(1px);
    box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.2);
  }

  .pause-btn.paused {
    background: linear-gradient(145deg, #4ecdc4, #2ed573);
  }

  .sound-info {
    background: rgba(255, 255, 255, 0.9);
    padding: 10px 20px;
    border-radius: 50px;
    font-size: 1.1rem;
    min-width: 200px;
    text-align: center;
    box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.1);
    border: 3px solid #feca57;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 30px;
    max-width: 900px;
    padding: 20px;
    background-color: rgba(255, 255, 255, 0.9);
    border-radius: 25px;
    border: 15px dashed #ff6b6b;
    box-shadow: 
      20px 20px 0 rgba(0, 0, 0, 0.2),
      inset 0 0 50px rgba(78, 205, 196, 0.3);
  }

  .cell {
    background: linear-gradient(145deg, #ffffff, #f0f0f0);
    border-radius: 20px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    border: 5px solid;
    position: relative;
    overflow: hidden;
  }

  .cell:hover {
    transform: scale(1.1) rotate(5deg);
    box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
  }

  .cell:active {
    transform: scale(0.95) rotate(-5deg);
  }

  .cell.playing {
    animation: cellPulse 1s infinite alternate;
  }

  @keyframes cellPulse {
    from { box-shadow: 0 0 20px rgba(255, 107, 107, 0.5); }
    to { box-shadow: 0 0 40px rgba(255, 107, 107, 0.8); }
  }

  .cell::before {
    content: "🔊";
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 1.5rem;
    opacity: 0.5;
  }

  .cell.playing::before {
    content: "🔊";
    animation: volumePulse 0.5s infinite alternate;
  }

  @keyframes volumePulse {
    from { transform: scale(1); opacity: 0.8; }
    to { transform: scale(1.2); opacity: 1; }
  }

  .cell:nth-child(1) {
    border-color: #ff6b6b;
    background: linear-gradient(145deg, #ff6b6b, #ff8e8e);
  }

  .cell:nth-child(2) {
    border-color: #4ecdc4;
    background: linear-gradient(145deg, #4ecdc4, #6bd7cf);
  }

  .cell:nth-child(3) {
    border-color: #feca57;
    background: linear-gradient(145deg, #feca57, #ffd98a);
  }

  .cell:nth-child(4) {
    border-color: #c9661a;
    background: linear-gradient(145deg, #f2781b, #ca6417);
  }

  .cell:nth-child(5) {
    border-color: #414040;
    background: linear-gradient(145deg, #9e9e9e, #9e9e9e);
  }

  .cell:nth-child(6) {
    border-color: #35a8c2;
    background: linear-gradient(145deg, #55c9e3, #48abc1);
  }

  .cell img {
    width: 150px;
    height: 150px;
    object-fit: contain;
    margin-bottom: 15px;
    filter: drop-shadow(5px 5px 0 rgba(0, 0, 0, 0.2));
    transition: transform 0.3s;
  }

  .cell:hover img {
    transform: scale(1.1) rotate(10deg);
  }

  .cell p {
    margin: 0;
    font-size: 1.5rem;
    font-weight: bold;
    color: #333;
    text-align: center;
    text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.5);
  }

  .floating {
    position: fixed;
    font-size: 2rem;
    animation: float 5s infinite linear;
    pointer-events: none;
    z-index: 100;
  }

  @keyframes float {
    0% {
      transform: translateY(100vh) rotate(0deg);
      opacity: 1;
    }
    100% {
      transform: translateY(-100px) rotate(360deg);
      opacity: 0;
    }
  }

  .instructions {
    margin-top: 30px;
    color: white;
    font-size: 1.2rem;
    text-align: center;
    background: rgba(0, 0, 0, 0.3);
    padding: 15px;
    border-radius: 15px;
    backdrop-filter: blur(5px);
  }

  .sound-wave {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 0;
    background: linear-gradient(transparent, rgba(255, 255, 255, 0.5));
    border-radius: 0 0 15px 15px;
    transition: height 0.2s;
  }

  .playing .sound-wave {
    height: 30px;
    animation: wave 0.5s infinite alternate;
  }

  @keyframes wave {
    from { height: 30px; }
    to { height: 50px; }
  }

  /* Dancing bananas in the background */
  .banana {
    position: fixed;
    font-size: 2rem;
    animation: dance 3s infinite alternate;
    z-index: -1;
  }

  @keyframes dance {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-20px) rotate(-20deg); }
    50% { transform: translateY(0) rotate(0deg); }
    75% { transform: translateY(-20px) rotate(20deg); }
  }

  /* Confetti effect */
  .confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    background: #ff6b6b;
    animation: confettiFall 2s linear forwards;
    pointer-events: none;
    z-index: 1000;
  }

  @keyframes confettiFall {
    0% {
      transform: translateY(-100px) rotate(0deg);
      opacity: 1;
    }
    100% {
      transform: translateY(100vh) rotate(720deg);
      opacity: 0;
    }
  }

  .pause-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 107, 107, 0.8);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    font-size: 4rem;
    color: white;
    font-weight: bold;
    text-shadow: 5px 5px 0 rgba(0, 0, 0, 0.3);
    animation: overlayPulse 1s infinite alternate;
  }

  @keyframes overlayPulse {
    from { background: rgba(255, 107, 107, 0.8); }
    to { background: rgba(78, 205, 196, 0.8); }
  }

@media (width < 500px){
    .grid{
        grid-template-columns: repeat(1, 1fr);
    }
}

</style>
</head>
<body>

<div class="header">
  <h1>🎵 Funny Sound Board 🎵</h1>
  
  <div class="controls">
    <button class="pause-btn" id="pauseBtn">
      <span>⏸️</span>
      <span>Pause All Sounds</span>
    </button>
    
    <div class="sound-info" id="soundInfo">
      No sound playing
    </div>
  </div>
</div>

<div class="grid">
  <div class="cell" data-sound="sound1" data-name="OII AI OII II AI">
    <img src="cat.png" alt="Funny Cat">
    <p>OII AI OII II AI</p>
    <div class="sound-wave"></div>
  </div>
  
  <div class="cell" data-sound="sound2" data-name="HAAAAAA AAAAAA">
    <img src="beaver.jpg" alt="Funny Dog">
    <p>HAAAAAA AAAAAA</p>
    <div class="sound-wave"></div>
  </div>
  
  <div class="cell" data-sound="sound3" data-name="YAAAAAAAAAAAAA">
    <img src="chicken.jpg" alt="Funny Cow">
    <p>YAAAAAAAAAAAAA</p>
    <div class="sound-wave"></div>
  </div>

  <div class="cell" data-sound="sound4" data-name="TAN TANAN TANAN TANAN TA">
    <img src="speed.jpg" alt="Speed">
    <p>TAN TANAN TANAN TANAN TA</p>
    <div class="sound-wave"></div>
  </div>
  
  <div class="cell" data-sound="sound5" data-name="HEHEE">
    <img src="hehee.webp" alt="HEHEE">
    <p>HEHEE</p>
    <div class="sound-wave"></div>
  </div>

  <div class="cell" data-sound="sound6" data-name="Shamone">
    <img src="shamone.jpg" alt="Shamone">
    <p>SHAMONE</p>
    <div class="sound-wave"></div>
  </div>

  <div class="cell" data-sound="sound7" data-name="ULULULULU">
    <img src="#" alt="Shamone">
    <p>ULULULULU</p>
    <div class="sound-wave"></div>
  </div>
</div>

<div class="pause-overlay" id="pauseOverlay">
  ⏸️ PAUSED ⏸️
</div>

<p class="instructions">Click any image to play its sound! 🎶<br>Click pause button to stop all sounds</p>

<audio id="sound1" src="cat.mp3"></audio>
<audio id="sound2" src="beaver.mp3"></audio>
<audio id="sound3" src="chicken.mp3"></audio>
<audio id="sound4" src="speed.mp3"></audio>
<audio id="sound5" src="hehee.mp3"></audio>
<audio id="sound6" src="shamone.mp3"></audio>
<audio id="sound7" src="ulululu.mp3"></audio>

<script>
  // Add floating bananas to background
  for (let i = 0; i < 8; i++) {
    setTimeout(() => {
      const banana = document.createElement('div');
      banana.className = 'banana';
      banana.textContent = '🍌';
      banana.style.left = Math.random() * 100 + 'vw';
      banana.style.top = Math.random() * 100 + 'vh';
      banana.style.fontSize = (Math.random() * 2 + 1) + 'rem';
      document.body.appendChild(banana);
    }, i * 300);
  }

  const cells = document.querySelectorAll('.cell');
  const pauseBtn = document.getElementById('pauseBtn');
  const soundInfo = document.getElementById('soundInfo');
  const pauseOverlay = document.getElementById('pauseOverlay');
  const floatingEmojis = ['🎵', '🎶', '🎸', '🥁', '🎺', '🎷', '🪕', '🎻', '📯', '🎼'];
  
  let isPaused = false;
  let currentAudio = null;
  let currentCell = null;

  cells.forEach((cell) => {
    cell.addEventListener('click', function() {
      if (isPaused) return;
      
      // Stop current sound if playing
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        if (currentCell) {
          currentCell.classList.remove('playing');
        }
      }
      
      // Play new sound
      const soundId = this.getAttribute('data-sound');
      const soundName = this.getAttribute('data-name');
      currentAudio = document.getElementById(soundId);
      currentCell = this;
      
      currentAudio.currentTime = 0;
      currentAudio.play();
      
      // Update UI
      this.classList.add('playing');
      soundInfo.textContent = `Now playing: ${soundName}`;
      
      // Create floating emojis
      for (let i = 0; i < 5; i++) {
        setTimeout(() => {
          const emoji = document.createElement('div');
          emoji.className = 'floating';
          emoji.textContent = floatingEmojis[Math.floor(Math.random() * floatingEmojis.length)];
          emoji.style.left = Math.random() * 100 + 'vw';
          emoji.style.color = getRandomColor();
          document.body.appendChild(emoji);
          
          setTimeout(() => emoji.remove(), 5000);
        }, i * 100);
      }
      
      // Create confetti
      createConfetti();
      
      // Handle audio end
      currentAudio.onended = () => {
        this.classList.remove('playing');
        soundInfo.textContent = 'No sound playing';
        currentAudio = null;
        currentCell = null;
      };
    });
  });

  // Pause/Play button
  pauseBtn.addEventListener('click', function() {
    isPaused = !isPaused;
    
    if (isPaused) {
      // Pause all sounds
      if (currentAudio) {
        currentAudio.pause();
        if (currentCell) {
          currentCell.classList.remove('playing');
        }
      }
      
      // Update button
      this.innerHTML = '<span>▶️</span><span>Play All Sounds</span>';
      this.classList.add('paused');
      soundInfo.textContent = 'All sounds paused';
      pauseOverlay.style.display = 'flex';
      
      // Pause all audio elements
      document.querySelectorAll('audio').forEach(audio => {
        audio.pause();
      });
      
    } else {
      // Unpause
      this.innerHTML = '<span>⏸️</span><span>Pause All Sounds</span>';
      this.classList.remove('paused');
      soundInfo.textContent = currentAudio ? 'Ready to play' : 'No sound playing';
      pauseOverlay.style.display = 'none';
      
      // Resume current audio if there was one
      if (currentAudio && currentAudio.currentTime > 0) {
        currentAudio.play();
        if (currentCell) {
          currentCell.classList.add('playing');
        }
        soundInfo.textContent = `Now playing: ${currentCell.getAttribute('data-name')}`;
      }
    }
  });

  // Spacebar to pause/play
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      pauseBtn.click();
    }
  });

  function getRandomColor() {
    const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#feca57'];
    return colors[Math.floor(Math.random() * colors.length)];
  }

  function createConfetti() {
    for (let i = 0; i < 50; i++) {
      setTimeout(() => {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.backgroundColor = getRandomColor();
        confetti.style.width = Math.random() * 15 + 5 + 'px';
        confetti.style.height = Math.random() * 15 + 5 + 'px';
        confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
        document.body.appendChild(confetti);
        
        setTimeout(() => confetti.remove(), 2000);
      }, i * 20);
    }
  }

  // Auto-float some emojis occasionally
  setInterval(() => {
    if (!isPaused && Math.random() > 0.7) {
      const emoji = document.createElement('div');
      emoji.className = 'floating';
      emoji.textContent = floatingEmojis[Math.floor(Math.random() * floatingEmojis.length)];
      emoji.style.left = Math.random() * 100 + 'vw';
      emoji.style.color = getRandomColor();
      document.body.appendChild(emoji);
      setTimeout(() => emoji.remove(), 5000);
    }
  }, 3000);
</script>

</body>
</html>
